# Satsang events keeper (keeper/events/run.mjs): weekly, free, no LLM. Reads each place's own public iCal feed or
# schema.org JSON-LD Event, keeps the next 90 days, commits app/site/data/events.json to main when it changed, and
# (when the CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets exist) puts it in KV so /data/events.json is fresh
# before the next site deploy. The /place/<id> pages pick the events up at the next `sh app/deploy.sh`.
name: events-weekly
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: events
  cancel-in-progress: false
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read event feeds (polite: robots.txt, 10 s timeout, 6 hosts at a time)
        run: node keeper/events/run.mjs
      - name: Commit events.json
        run: |
          git config user.name "satsang-events-keeper"
          git config user.email "actions@users.noreply.github.com"
          git add app/site/data/events.json
          git diff --cached --quiet && echo "no change" || (git commit -m "events keeper: weekly refresh" && git pull --rebase --autostash origin main && git push origin HEAD:main)
      - name: Publish to KV (optional)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "no Cloudflare secret: events reach the site at the next deploy"; exit 0; }
          cd app/web-worker && npx --yes wrangler@4 kv key put data/events.json --path ../site/data/events.json --binding DATA --remote
      - name: Summary
        if: always()
        run: node -e "const m=require('./app/site/data/events.json').meta;console.log('places with events',m.places_with_events,'events',m.events)" >> "$GITHUB_STEP_SUMMARY" || true
