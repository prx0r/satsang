  <path d="M867,155 L867,175 L887,175 L887,155" fill="none" stroke="#d9982f" stroke-width="1.5"/>
  
    <text x="450" y="30" text-anchor="middle" font-size="16" fill="#efe9dd" font-family="serif">The Twelve-Link Machine</text>
    <text x="450" y="48" text-anchor="middle" font-size="10" fill="#929aab" font-family="monospace">DEPENDENT ARISING · PAṬICCASAMUPPĀDA</text>
    <text x="450" y="485" text-anchor="middle" font-size="9" fill="#929aab" font-family="sans-serif" opacity="0.6">Click any gear to remove it. The machine stops. That is nibbāna.</text>
  
    <rect x="700" y="420" width="180" height="55" rx="4" fill="#0f1320" stroke="#2a3040" stroke-width="1"/>
    <text x="710" y="440" font-size="9" fill="#929aab" font-family="monospace">LINKS ACTIVE: <tspan id="active-count" fill="#e8cf96">12</tspan></text>
    <text x="710" y="455" font-size="9" fill="#929aab" font-family="monospace">STATUS: <tspan id="machine-status" fill="#e8cf96">RUNNING</tspan></text>
</svg>
<script>
  const gears = document.querySelectorAll('.gear-group');
  const chains = document.querySelectorAll('.chain-link');
  const ball = document.querySelector('.ball');
  const activeEl = document.getElementById('active-count');
  const statusEl = document.getElementById('machine-status');
  let removed = new Set();

  gears.forEach(g => {
    g.addEventListener('click', () => {
      const idx = parseInt(g.dataset.index);
      const linkId = g.dataset.link;
      if (removed.has(idx)) {
        // Restore
        removed.delete(idx);
        g.classList.remove('removed');
        chains[idx - 1]?.style.setProperty('opacity', '1');
        chains[idx]?.style.setProperty('opacity', '1');
      } else {
        // Remove
        removed.add(idx);
        g.classList.add('removed');
        // Hide all chains after this point
        for (let i = idx - 1; i < chains.length; i++) {
          chains[i]?.style.setProperty('opacity', '0.15');
        }
      }
      updateState();
    });
  });

  function updateState() {
    const active = 12 - removed.size;
    activeEl.textContent = active;
    if (active === 12) {
      statusEl.textContent = 'RUNNING';
      statusEl.setAttribute('fill', '#e8cf96');
      ball.setAttribute('opacity', '0.8');
    } else if (active === 0) {
      statusEl.textContent = 'STILL';
      statusEl.setAttribute('fill', '#efe9dd');
      ball.setAttribute('opacity', '0.15');
    } else {
      const firstRemoved = Math.min(...removed);
      statusEl.textContent = 'STOPPED AT ' + firstRemoved;
      statusEl.setAttribute('fill', '#d9982f');
      ball.setAttribute('opacity', '0.3');
    }
  }
</script>
