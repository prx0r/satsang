<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Satsang · Practice engine preview</title>
<meta name="description" content="Practice instructions rendered as a real-time picture of what the breath and attention are doing in the body. Preview of the Satsang practice engine.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../player/player.css">
<style>
  html,body{margin:0;height:100%;background:#0a0d14}
  #stage{position:fixed;inset:0;height:100dvh}
  noscript{color:#efe9dd;font:16px system-ui;padding:24px;display:block}
</style>
</head>
<body>
<div id="stage"></div>
<noscript>The practice engine needs JavaScript.</noscript>
<script type="module">
import { compile } from '../compile.mjs'
import { createPlayer } from '../player/player.js'

const PRACTICES = [
  ['nadi-shodhana-sivananda', 'Nadi Shodhana'],
  ['ajahn-lee-method-2', 'Ajahn Lee · full body'],
  ['kapalabhati-sivananda', 'Kapalabhati'],
  ['kapala-dharana-vbt34', 'Cavern of the skull'],
  ['bhramari', 'Bhramari'],
  ['ajahn-lee-method-1', 'Ajahn Lee · bud-dho'],
]
const qs = new URLSearchParams(location.search)
const base = new URL('../', import.meta.url)
const getJSON = p => fetch(new URL(p, base)).then(r => { if (!r.ok) throw new Error(p + ' ' + r.status); return r.json() })
const grammar = await getJSON('grammar.json')
const cache = {}
const loadP = id => cache[id] ||= getJSON(`practices/${id}.json`)

const player = createPlayer(document.getElementById('stage'), {
  grammar, compile,
  options: { beginner: qs.get('beginner') === '1', voice: qs.get('voice') === '1', muted: qs.get('muted') === '1', skip_stages: (qs.get('skip') || '').split(',').filter(Boolean) },
})
// practice picker lives in the player's header slot
const chips = PRACTICES.map(([id, label], i) => {
  const b = document.createElement('button'); b.className = 'sp-chip'; b.textContent = label; b.dataset.id = id
  b.title = `${label} (key ${i + 1})`
  b.onclick = () => choose(id)
  player.slot.appendChild(b); return b
})
// rendered media (TEXT-TO-PRACTICE §8): cached Fish narration clips + the generated cue kit, when the practice has them.
// Narration clips are matched by caption text, so captions without a clip fall back to speechSynthesis.
const media = {}
async function loadMedia(id) {
  if (id in media) return media[id]
  try {
    const [v, c] = await Promise.all([getJSON(`renders/${id}/voice/manifest.json`), getJSON(`renders/${id}/cues/cues.json`).catch(() => null)])
    media[id] = { clips: new Map(v.lines.map(l => [l.text, new URL(l.file, base).href])), cues: c ? Object.fromEntries(Object.entries(c.cues).map(([k, x]) => [k, new URL(`renders/${id}/cues/${x.file}`, base).href])) : {}, voice: v.voice }
  } catch { media[id] = null }
  return media[id]
}
let clip = null
const fallbackTTS = { speak(t) { if (!('speechSynthesis' in window)) return Promise.resolve(); speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t.replace(/[“”]/g, '')); u.rate = 0.86; return new Promise(r => { u.onend = r; u.onerror = r; speechSynthesis.speak(u) }) }, cancel() { try { speechSynthesis.cancel() } catch { } } }
function useMedia(m) {
  if (!m) { delete window.SatsangTTS; delete window.SatsangCues; return }
  const caption = () => document.querySelector('.sp-caption p')?.textContent || ''
  window.SatsangTTS = {
    speak(text) { const url = m.clips.get(caption()) || m.clips.get(text); if (!url) return fallbackTTS.speak(text)
      clip?.pause(); clip = new Audio(url); clip.volume = 1; return new Promise(r => { clip.onended = r; clip.onerror = r; clip.play().catch(r) }) },
    cancel() { clip?.pause(); fallbackTTS.cancel() },
  }
  window.SatsangCues = { play(kind) { const u = m.cues[kind] || (kind === 'bell-soft' ? m.cues.chime : null); if (!u) return false; const a = new Audio(u); a.volume = 0.2; a.play().catch(() => { }); return true } }
}
async function choose(id, o = {}) {
  const [p, m] = await Promise.all([loadP(id), loadMedia(id)])
  useMedia(m)
  if (m && !qs.has('voice')) player.set({ voice: true })   // a rendered narration exists: voice on by default (V toggles)
  chips.forEach(c => c.setAttribute('aria-current', String(c.dataset.id === id)))
  player.load(p, o)
  const u = new URL(location.href); u.searchParams.set('p', id); u.searchParams.delete('t'); history.replaceState(null, '', u)
}
window.addEventListener('keydown', e => { const n = +e.key; if (n >= 1 && n <= PRACTICES.length && !e.metaKey && !e.ctrlKey) choose(PRACTICES[n - 1][0]) })

const first = PRACTICES.some(([id]) => id === qs.get('p')) ? qs.get('p') : PRACTICES[0][0]
await choose(first)
if (qs.has('t')) {                       // deterministic frame for screenshots: ?p=…&t=12.5
  await document.fonts.ready
  player.hideGate()
  player.renderAt(+qs.get('t'))
  if (qs.get('still') !== '0') player.freeze()
  window.__frameReady = true
} else window.__frameReady = true
window.satsangPlayer = player
</script>
</body>
</html>
