<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0d14">
<title>Satsang · The breathing figure</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../player/figure.css">
<style>
  html,body{margin:0;height:100%;background:#0a0d14;color:#efe9dd;font:15px 'Inter Tight',system-ui,sans-serif}
  main{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;padding:20px 24px calc(18px + env(safe-area-inset-bottom))}
  h1{font:600 26px 'Cormorant Garamond',serif;color:#e8cf96;margin:0}
  h1 small{font:500 13px 'Inter Tight';color:rgba(239,233,221,.55);letter-spacing:.08em;text-transform:uppercase;margin-left:10px}
  .views{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;min-height:0;position:relative}
  .views.front-only{grid-template-columns:1fr}.views.side-only{grid-template-columns:1fr}
  .v{position:relative;min-height:0}.v .lab{position:absolute;left:0;top:4px;font:600 11px 'Inter Tight';letter-spacing:.14em;text-transform:uppercase;color:rgba(232,207,150,.6)}
  .bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:rgba(239,233,221,.7)}
  .bar b{color:#e8cf96;font-weight:600;min-width:96px;display:inline-block}
  .meter{display:flex;gap:10px;flex-wrap:wrap}.meter span{display:inline-flex;gap:6px;align-items:center}
  .meter i{display:inline-block;width:46px;height:4px;border-radius:2px;background:rgba(239,233,221,.12);overflow:hidden}
  .meter i::after{content:'';display:block;height:100%;width:calc(var(--v,0)*100%);background:#e8cf96}
  button{font:600 14px 'Inter Tight';color:#0a0d14;background:#efe9dd;border:0;border-radius:22px;padding:10px 18px;min-height:44px;cursor:pointer}
  select{font:500 14px 'Inter Tight';background:#141a26;color:#efe9dd;border:1px solid rgba(239,233,221,.2);border-radius:10px;padding:8px;min-height:44px}
  @media (max-width:700px){.views{grid-template-columns:1fr;grid-template-rows:1.3fr 1fr}}
</style>
</head>
<body>
<main>
  <h1>The breathing figure <small id="sub">full yogic breath</small></h1>
  <div class="views" id="views"><div class="v" id="vf"><span class="lab">Front</span></div><div class="v" id="vs"><span class="lab">Side</span></div></div>
  <div class="bar">
    <button id="pp">Pause</button>
    <select id="style" aria-label="Breath style"><option>full</option><option>abdominal</option><option>thoracic</option><option>clavicular</option><option>natural</option></select>
    <b id="ph">inhale</b>
    <span class="meter"><span>belly <i id="mb"></i></span><span>ribs <i id="mr"></i></span><span>collarbones <i id="mc"></i></span><span>diaphragm <i id="md"></i></span></span>
  </div>
</main>
<script type="module">
import { breathState } from '../body/breath.mjs'
import { createFigure } from '../body/figure.mjs'
const qs = new URLSearchParams(location.search)
const reduced = qs.get('reduced') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches
if (reduced) document.body.classList.add('sf-reduced')
// a paced 4 s in / 6 s out timeline (the same shape compile.mjs emits), so the page needs no practice file
const B = []; let t = 0
for (let i = 0; i < 60; i++) { B.push({ t, dur: 4, phase: 'in', vol0: 0.08, vol1: 1 }); t += 4; B.push({ t, dur: 6, phase: 'out', vol0: 1, vol1: 0.08 }); t += 6 }
const tl = { total_s: t, tracks: { breath: B } }
const view = qs.get('view') || 'both'
const V = document.getElementById('views')
if (view === 'front') { V.classList.add('front-only'); document.getElementById('vs').remove() }
if (view === 'side') { V.classList.add('side-only'); document.getElementById('vf').remove() }
const figs = []
if (view !== 'side') { const f = createFigure(document, 'front'); document.getElementById('vf').appendChild(f.svg); figs.push(f) }
if (view !== 'front') { const f = createFigure(document, 'side'); document.getElementById('vs').appendChild(f.svg); figs.push(f) }
let style = qs.get('style') || 'full', playing = !qs.has('t'), T = +(qs.get('t') || 0), last = 0
const sel = document.getElementById('style'); sel.value = style; sel.onchange = () => style = sel.value
document.getElementById('sub').textContent = style === 'full' ? 'full yogic breath' : style + ' breath'
const pp = document.getElementById('pp'); pp.onclick = () => { playing = !playing; pp.textContent = playing ? 'Pause' : 'Play' }; if (!playing) pp.textContent = 'Play'
const m = id => document.getElementById(id)
function draw() {
  const s = breathState(tl, T % tl.total_s, { style })
  for (const f of figs) f.update(s, T, { gain: reduced ? 0.45 : 1, reduced })
  m('ph').textContent = s.inhaling ? 'inhale' : s.exhaling ? 'exhale' : 'turn'
  m('mb').style.setProperty('--v', Math.min(1, s.belly)); m('mr').style.setProperty('--v', Math.min(1, s.ribs)); m('mc').style.setProperty('--v', Math.min(1, s.clav)); m('md').style.setProperty('--v', Math.min(1, s.diaphragm))
}
function loop(ts) { requestAnimationFrame(loop); const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0; last = ts; if (playing) T += dt * (reduced ? 0.8 : 1); draw() }
draw(); requestAnimationFrame(loop)
window.__ready = true
</script>
</body>
</html>
