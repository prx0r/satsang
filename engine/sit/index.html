<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Sit · Satsang</title>
<style>
  :root { --ink: #6f624d; --soft: #8a7a62; --faint: #b8a888; --gold: #b08a3e; --line: rgba(176,138,62,.22); --card: rgba(255,255,255,.88); }
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; overscroll-behavior: none; }
  body { font: 300 16px/1.45 "Cormorant Garamond", Georgia, serif; color: var(--ink); -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  button { font: inherit; color: inherit; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  /* start card */
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top)) 14px max(16px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.55); }
  #start[hidden] { display: none; }
  .card { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--card); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 18px; box-shadow: 0 10px 40px rgba(120,100,60,.08); }
  h1 { font-weight: 400; font-size: 30px; margin: 0 0 2px; letter-spacing: .02em; color: var(--ink); }
  .lede { margin: 0 0 14px; color: var(--soft); font-style: italic; }
  .tabs { display: flex; gap: 6px; margin: 4px 0 10px; }
  .tabs button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--soft); min-height: 36px; }
  .tabs button[aria-selected="true"] { background: #f6efe1; color: var(--ink); border-color: rgba(176,138,62,.45); }
  .list { display: grid; gap: 6px; margin-bottom: 12px; }
  @media (min-width: 700px) { .card { width: min(760px, 100%); } .list { grid-template-columns: 1fr 1fr; } }
  .opt span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .opt { text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.7); border-radius: 12px; padding: 9px 12px; cursor: pointer; min-height: 44px; }
  .opt[aria-pressed="true"] { border-color: var(--gold); background: #fbf6ea; }
  .opt b { font-weight: 500; display: block; font-size: 17px; }
  .opt span { color: var(--soft); font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0; }
  .lab { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); width: 100%; margin-top: 4px; }
  .chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; cursor: pointer; min-height: 36px; color: var(--soft); }
  .chip[aria-pressed="true"] { background: #f6efe1; color: var(--ink); border-color: rgba(176,138,62,.5); }
  .chip[disabled] { opacity: .35; cursor: default; }
  .note { font-size: 14px; color: var(--soft); margin: 6px 0 0; }
  .caution { font-size: 14px; color: #8b6a4a; background: #fbf4ea; border-radius: 10px; padding: 8px 11px; margin: 10px 0 0; }
  .caution ul { margin: 4px 0 0 18px; padding: 0; }
  .card.pick { display: flex; flex-direction: column; overflow: hidden; padding: 0; }
  .pick .scroll { overflow: auto; padding: 22px 22px 6px; min-height: 0; }
  .pick .go #plan { margin: 0 0 8px; }
  .pick .go { flex: none; padding: 10px 22px 16px; border-top: 1px solid var(--line); }
  @media (max-width: 480px) { .pick .scroll { padding: 18px 16px 6px; } .pick .go { padding: 10px 16px 14px; } }
  #begin { width: 100%; border: 0; border-radius: 999px; background: #c9a45c; color: #fff; font-size: 19px; letter-spacing: .06em; padding: 12px; cursor: pointer; min-height: 50px; }
  #begin:focus-visible, .opt:focus-visible, .chip:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .src { font-size: 13px; color: var(--faint); margin-top: 10px; }
  .src a { color: var(--soft); }
  /* running */
  #hud { position: fixed; inset: 0; pointer-events: none; transition: opacity 1.6s ease; }
  #hud.idle { opacity: .0; }
  #hud.idle #caption, #hud.idle #word { opacity: 1; }
  #top { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: calc(16px + env(safe-area-inset-left)); right: 110px; color: var(--soft); font-size: 15px; letter-spacing: .04em; }
  #top small { display: block; color: var(--faint); font-size: 13px; font-style: italic; }
  #ctl { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right)); display: flex; gap: 4px; pointer-events: auto; }
  #ctl button, #prov { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; color: var(--faint); display: grid; place-items: center; }
  #ctl button:hover, #ctl button:focus-visible { color: var(--gold); outline: none; }
  #ctl svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  #caption { position: fixed; left: 0; right: 0; bottom: calc(54px + env(safe-area-inset-bottom)); text-align: center; padding: 0 22px; font-size: 19px; font-style: italic; color: var(--ink); opacity: 0; transition: opacity 2.2s ease; pointer-events: none; }
  #caption.on { opacity: .82; }
  #caption q { display: block; quotes: none; font-size: 14px; color: var(--faint); margin-top: 4px; font-style: normal; }
  #word { position: fixed; left: 0; right: 0; top: 46%; text-align: center; font-size: 15px; letter-spacing: .3em; color: var(--gold); opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  #word.on { opacity: .55; }
  #provBtn { position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom)); pointer-events: auto; border: 0; background: transparent; color: var(--faint); font-size: 14px; letter-spacing: .05em; cursor: pointer; padding: 10px 8px; min-height: 44px; }
  #provBtn:hover, #provBtn:focus-visible { color: var(--gold); outline: none; }
  #bar { position: fixed; left: 0; bottom: 0; height: 2px; background: rgba(201,164,92,.45); width: 0; }
  #sheet { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100% - 20px)); max-height: 62vh; overflow: auto; background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: 0 10px 40px rgba(120,100,60,.1); font-size: 16px; pointer-events: auto; }
  #sheet[hidden] { display: none; }
  #sheet h2 { font-weight: 400; font-size: 20px; margin: 0 0 6px; }
  #sheet .ref { font-size: 13px; color: var(--faint); letter-spacing: .04em; }
  #sheet blockquote { margin: 4px 0 12px; padding-left: 12px; border-left: 2px solid rgba(201,164,92,.5); font-style: italic; }
  #sheet .att { font-size: 13px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 8px; margin-top: 6px; }
  #sheet a { color: var(--gold); }
  #sheet .x { float: right; border: 0; background: transparent; font-size: 22px; color: var(--faint); cursor: pointer; width: 40px; height: 40px; margin: -8px -8px 0 0; }
  /* eyes closed: the screen goes dark, sound carries the session */
  #dim { position: fixed; inset: 0; background: #0b0a08; opacity: 0; pointer-events: none; transition: opacity 2.5s ease; display: grid; place-items: end center; color: #4a4232; font-size: 14px; letter-spacing: .08em; padding-bottom: calc(26px + env(safe-area-inset-bottom)); }
  body.eyes #dim { opacity: .965; pointer-events: auto; }
  #nogl { position: fixed; inset: 0; display: none; }
  /* end */
  #end { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(255,255,255,.6); }
  #end[hidden] { display: none; }
  #end .card { text-align: center; }
  #end button { border: 1px solid var(--line); border-radius: 999px; background: transparent; padding: 9px 18px; margin: 10px 4px 0; cursor: pointer; min-height: 44px; color: var(--ink); }
  @media (max-width: 480px) { h1 { font-size: 26px; } #caption { font-size: 17px; bottom: calc(58px + env(safe-area-inset-bottom)); } .card { padding: 18px 16px 14px; } }
  @media (prefers-reduced-motion: reduce) { #caption, #word, #hud, #dim { transition: none; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="nogl" aria-hidden="true"></canvas>

<div id="hud" hidden>
  <div id="top"><span id="stage"></span><small id="where"></small><small id="clock"></small></div>
  <div id="ctl">
    <button id="eyesBtn" aria-pressed="false" aria-label="Eyes closed: dim the screen, sound only" title="Eyes closed (E)">
      <svg viewBox="0 0 24 24"><path d="M3 12c2.5 3 5.5 4.5 9 4.5s6.5-1.5 9-4.5M6 15.5 4.5 18M18 15.5l1.5 2.5M12 16.5V19"/></svg></button>
    <button id="pauseBtn" aria-label="Pause" title="Pause (Space)"><svg viewBox="0 0 24 24"><path d="M9 7v10M15 7v10"/></svg></button>
    <button id="stopBtn" aria-label="Stop" title="Stop (Esc)"><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></button>
  </div>
  <div id="word" aria-hidden="true"></div>
  <div id="caption" role="status" aria-live="polite"></div>
  <button id="provBtn" aria-haspopup="dialog">From the text</button>
  <div id="bar"></div>
</div>
<div id="sheet" role="dialog" aria-label="From the text" hidden></div>
<div id="dim" aria-hidden="true">eyes closed · tap to open</div>

<div id="start">
  <div class="card pick" role="dialog" aria-labelledby="h"><div class="scroll">
    <h1 id="h">Sit</h1>
    <p class="lede">Choose a practice, press Begin, close your eyes. It runs by itself: the body of light breathes, the light of attention moves where the text says, soft bells mark each step.</p>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabP" aria-selected="true">Practices</button>
      <button role="tab" id="tabR" aria-selected="false">Routines</button>
    </div>
    <div class="list" id="list" role="listbox" aria-label="Practices"></div>
    <div class="row" id="lenRow"><div class="lab">Length</div></div>
    <div class="row" id="optRow"><div class="lab">Options</div>
      <button class="chip" id="oVoice" aria-pressed="false">Spoken guidance</button>
      <button class="chip" id="oEyes" aria-pressed="false">Eyes closed: dark screen</button>
      <button class="chip" id="oBeg" aria-pressed="false">Beginner form</button>
      <button class="chip" id="oMic" aria-pressed="false" title="The light follows your own breath sound (microphone, stays on this device)">Follow my breath (mic)</button>
    </div>
    <div class="caution" id="caut" hidden></div>
    <div class="src" id="src"></div>
  </div><div class="go"><p class="note" id="plan"></p><button id="begin">Begin</button></div></div>
</div>

<div id="end" hidden><div class="card"><h1>Complete</h1><p class="lede" id="endTxt"></p>
  <button id="again">Sit again</button><button id="other">Choose another</button></div></div>

<script type="module" src="./sit.js"></script>
</body>
</html>
